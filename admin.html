<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>러브어바웃 관리자</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
<style>
:root{--bg:#fcf8f5;--bg-alt:#f6ece7;--ink:#3b2f2d;--soft:#86736e;--line:#ebdcd5;--rose:#c08580;--ok:#5b8a6a;--bad:#b4534b;
 --en:"Cormorant Garamond","Times New Roman",serif;--sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1f1817;--bg-alt:#2a2120;--ink:#f1e6e1;--soft:#b39f99;--line:#3d3230;--rose:#dca39d;--ok:#8fc0a0;--bad:#e08a82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1817;--bg-alt:#2a2120;--ink:#f1e6e1;--soft:#b39f99;--line:#3d3230;--rose:#dca39d;--ok:#8fc0a0;--bad:#e08a82;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{font-family:var(--en);font-style:italic;font-size:24px;color:inherit;text-decoration:none}
.logo small{font-family:var(--sans);font-style:normal;font-size:12px;color:var(--soft);margin-left:8px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;font-size:13px;background:none;border:1px solid transparent;color:var(--soft);padding:6px 12px;cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);border-color:var(--rose)}
main{padding-block:28px 60px}
h1{font-family:var(--en);font-style:italic;font-weight:400;font-size:32px;margin:0 0 6px}
h2{font-size:17px;font-weight:500;margin:0 0 12px}
.soft{color:var(--soft)}
.card{border:1px solid var(--line);background:var(--bg);padding:20px}
.auth{max-width:380px;margin:60px auto;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:12px;color:var(--soft)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:-1px}
.btn{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px}
.btn.fill{background:var(--ink);color:var(--bg)}.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:13px;min-height:1.2em;margin:0}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input,.bar select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;border:1px solid var(--line);padding:2px 10px}
.list{display:grid;gap:12px}
.bk{border:1px solid var(--line);background:var(--bg);display:grid;grid-template-columns:1fr 280px;gap:0}
.bk .info{padding:16px 18px;min-width:0}
.bk .side{padding:16px;border-left:1px solid var(--line);background:var(--bg-alt);display:grid;gap:8px;align-content:start}
.bk h3{margin:0 0 8px;font-size:15px;font-weight:500;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.bk h3 .no{color:var(--soft);font-weight:400;font-size:13px}
.st{font-size:12px;padding:1px 8px;border:1px solid var(--rose);color:var(--rose)}
.st.예약확정{border-color:var(--ok);color:var(--ok)}.st.취소{border-color:var(--bad);color:var(--bad)}
.flags{display:flex;gap:4px;flex-wrap:wrap}.flags .st{white-space:nowrap}.flags .none{color:var(--soft);font-size:12px}
.st.paid{border-color:var(--rose);color:var(--rose)}.st.conf{border-color:var(--ok);background:var(--ok);color:#fff}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg button{font:inherit;font-size:13px;padding:10px 6px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--ink)}
.tg button[aria-pressed="true"].tPaid{background:var(--rose);border-color:var(--rose);color:#fff}
.tg button[aria-pressed="true"].tConf{background:var(--ok);border-color:var(--ok);color:#fff}
.tg button:disabled{opacity:.6;cursor:wait}
.chip.cnt{font:inherit;font-size:14px;padding:8px 16px;cursor:pointer;background:var(--bg)}
.chip.cnt b{font-weight:600;margin-left:4px}
.chip.cnt.pend b{color:var(--rose)}.chip.cnt.conf b{color:var(--ok)}
.chip.cnt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bk-title{font:inherit;color:inherit;margin:0 0 3px;padding:0;border:0;background:none}
.pbox{border:1px solid var(--line);background:var(--bg);padding:10px;display:grid;gap:6px}
.pitems{list-style:none;margin:0;padding:0;font-size:12.5px}.pitems li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line)}
.pbox-h{margin:0;font-size:12.5px;color:var(--soft)}
.pbox input{text-align:right;font-variant-numeric:tabular-nums}
.pbal{margin:2px 0 0;display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--line);padding-top:8px}.pbal b{font-size:15px}
.wrote{margin:8px 0 0;font-size:13px;color:var(--soft)}
.pwrow{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:13px;color:var(--soft)}
.pwrow code{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:2px 8px;margin-left:6px}
dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
dt{color:var(--soft)}dd{margin:0;overflow-wrap:anywhere}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--bad)}
.prod-group{margin-bottom:28px}
.prow{display:grid;grid-template-columns:1.2fr 1fr 1fr 2fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.prow.add{grid-template-columns:.7fr 1.4fr 1fr 2fr auto}
.prow .h{font-size:12px;color:var(--soft)}
.terms-ed textarea{min-height:260px}
.empty{padding:40px;text-align:center;color:var(--soft);border:1px dashed var(--line)}
.tbl-wrap{border-top:2px solid var(--ink);margin-top:6px}
.btbl{width:100%;border-collapse:collapse;font-size:14px}
.btbl th{font-weight:500;font-size:12.5px;color:var(--soft);text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.btbl td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.btbl tr.row{cursor:pointer}.btbl tr.row:hover td,.btbl tr.row.open td{background:var(--bg-alt)}
.btbl .c-no{width:56px;color:var(--soft);text-align:center}.btbl .c-st{width:150px}.btbl .c-who{width:110px}.btbl .c-date{width:110px;color:var(--soft);font-variant-numeric:tabular-nums}.btbl td.name .lk{font-size:11px;opacity:.55}.btbl th.c-no{text-align:center}
.btbl td.name b{font-weight:500}.btbl td.name small{display:block;color:var(--soft);font-size:12px}
.btbl tr.detail>td{padding:0 0 14px;background:var(--bg-alt)}
.btbl .empty{text-align:center;color:var(--soft);padding:40px 0}
.pager{display:flex;gap:4px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:34px;padding:6px 8px;border:1px solid var(--line);background:var(--bg);font:inherit;font-size:13px;cursor:pointer}
.pager button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
mark{background:#f6dfd6;color:inherit;padding:0 1px}
@media (max-width:820px){.btbl .c-who{display:none}.btbl .c-st{width:auto}}
@media (max-width:820px){.bk{grid-template-columns:1fr}.bk .side{border-left:0;border-top:1px solid var(--line)}.prow,.prow.add{grid-template-columns:1fr}.prow .h{display:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/">Love About<small>관리자</small></a>
 <nav id="nav" hidden><button data-v="bookings" aria-current="page">예약 관리</button><button data-v="products">상품 관리</button><button data-v="terms">약관 관리</button><button data-v="account">계정</button><button id="logout">로그아웃</button></nav></div></header>
<main class="wrap">

<section id="vSetup" hidden><form class="auth card" id="setupForm" novalidate>
 <h1>관리자 계정 만들기</h1>
 <p class="soft">처음 한 번만 만드는 계정이에요. 만든 뒤에는 이 화면이 다시 나오지 않아요.</p>
 <label>아이디 (영문·숫자 4자 이상)<input id="suUser" autocomplete="username" maxlength="30"></label>
 <label>비밀번호 (8자 이상)<input id="suPw" type="password" autocomplete="new-password" maxlength="64"></label>
 <label>비밀번호 확인<input id="suPw2" type="password" autocomplete="new-password" maxlength="64"></label>
 <p class="msg err" id="suMsg" role="alert"></p>
 <button class="btn fill" type="submit">계정 만들기</button>
</form></section>

<section id="vLogin" hidden><form class="auth card" id="loginForm" novalidate>
 <h1>관리자 로그인</h1>
 <label>아이디<input id="liUser" autocomplete="username" maxlength="30"></label>
 <label>비밀번호<input id="liPw" type="password" autocomplete="current-password" maxlength="64"></label>
 <p class="msg err" id="liMsg" role="alert"></p>
 <button class="btn fill" type="submit">로그인</button>
</form></section>

<section id="vBookings" hidden>
 <h1>예약 관리</h1>
 <form class="bar" id="qForm" role="search"><input id="q" type="search" placeholder="예약자 이름 검색" aria-label="이름 검색"><button class="btn sm fill" type="submit">검색</button><select id="fStatus" aria-label="상태"><option value="">전체</option><option value="pending">접수</option><option value="confirmed">예약확정</option></select><button class="btn sm" id="reload" type="button">새로고침</button></form>
 <div class="chips" id="counts"></div>
 <p class="soft" id="qInfo"></p>
 <div class="tbl-wrap"><table class="btbl"><thead><tr><th class="c-no">번호</th><th>제목</th><th class="c-who">작성자</th><th class="c-date">작성일</th><th class="c-st">상태</th></tr></thead><tbody id="bkList"><tr><td colspan="5" class="empty">불러오는 중이에요.</td></tr></tbody></table></div>
 <div class="pager" id="pager"></div>
</section>

<section id="vProducts" hidden>
 <h1>상품 관리</h1>
 <p class="soft">여기서 바꾼 상품명·구성·가격은 홈페이지 Pricing 화면과 예약 화면의 상품 선택에 바로 반영돼요. 구성은 한 줄에 하나씩 적어주세요.</p>
 <div class="prod-group"><h2>본식 스냅</h2><div id="pSnap"></div><button class="btn sm" type="button" data-add="snap">+ 상품 추가</button></div>
 <div class="prod-group"><h2>본식 DVD</h2><div id="pDvd"></div><button class="btn sm" type="button" data-add="dvd">+ 상품 추가</button></div>
 <div class="prod-group"><h2>추가 상품</h2><div id="pAdd"></div><button class="btn sm" type="button" data-add="addons">+ 추가 상품 추가</button></div>
 <div class="bar"><button class="btn fill" id="saveProducts" type="button">상품 저장</button><p class="msg" id="pMsg" role="status"></p></div>
</section>

<section id="vTerms" hidden class="terms-ed">
 <h1>약관 관리</h1>
 <p class="soft">예약 화면 1단계에 보이는 내용이에요.</p>
 <label>러브어바웃 필독사항<textarea id="tNotice"></textarea></label><br>
 <label>개인정보 처리방침<textarea id="tPrivacy"></textarea></label>
 <div class="bar" style="margin-top:12px"><button class="btn fill" id="saveTerms" type="button">약관 저장</button><p class="msg" id="tMsg" role="status"></p></div>
</section>

<section id="vAccount" hidden>
 <h1>계정</h1>
 <form class="card" id="pwForm" style="max-width:420px;display:grid;gap:10px" novalidate>
  <p class="soft" id="whoami"></p>
  <label>새 비밀번호 (8자 이상)<input id="npw" type="password" autocomplete="new-password" maxlength="64"></label>
  <label>새 비밀번호 확인<input id="npw2" type="password" autocomplete="new-password" maxlength="64"></label>
  <p class="msg" id="aMsg" role="status"></p>
  <button class="btn fill" type="submit">비밀번호 바꾸기</button>
 </form>
</section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let token=store.get("la_admin"),me=store.get("la_admin_user"),content=null,bookings=[],STATUSES=["접수","확인중","예약확정","촬영완료","취소"];
async function api(body){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})});const j=await r.json().catch(()=>({}));
 if(r.status===401&&token){logout();throw new Error("로그인이 만료됐어요. 다시 로그인해 주세요.")}if(!r.ok)throw new Error(j.error||"요청을 처리하지 못했어요.");return j}
function show(v){["vSetup","vLogin","vBookings","vProducts","vTerms","vAccount"].forEach(id=>$("#"+id).hidden=id!==v)}
function logout(){token=null;me=null;store.set("la_admin",null);store.set("la_admin_user",null);$("#nav").hidden=true;boot()}
async function boot(){if(token){$("#nav").hidden=false;go("bookings");return}
 try{const j=await api({action:"status"});show(j.hasAdmin?"vLogin":"vSetup")}catch(e){show("vLogin");$("#liMsg").textContent=e.message}}
function signedIn(j){token=j.token;me=j.username;store.set("la_admin",token);store.set("la_admin_user",me);$("#nav").hidden=false;go("bookings")}
$("#setupForm").onsubmit=async e=>{e.preventDefault();const m=$("#suMsg");m.textContent="";
 if($("#suPw").value!==$("#suPw2").value){m.textContent="비밀번호 확인이 일치하지 않아요.";return}
 try{signedIn(await api({action:"setup",username:$("#suUser").value.trim(),password:$("#suPw").value}))}catch(x){m.textContent=x.message}};
$("#loginForm").onsubmit=async e=>{e.preventDefault();const m=$("#liMsg");m.textContent="";
 try{signedIn(await api({action:"login",username:$("#liUser").value.trim(),password:$("#liPw").value}));$("#liPw").value=""}catch(x){m.textContent=x.message}};
$("#logout").onclick=logout;
$$("#nav [data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){$$("#nav [data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
 if(v==="bookings"){show("vBookings");loadBookings()}
 if(v==="products"){show("vProducts");loadContent().then(renderProducts)}
 if(v==="terms"){show("vTerms");loadContent().then(()=>{$("#tNotice").value=content.terms.notice||"";$("#tPrivacy").value=content.terms.privacy||""})}
 if(v==="account"){show("vAccount");$("#whoami").textContent="로그인한 아이디: "+me}}

/* 예약 관리 */
const rtypeLabel={personal:"휴대폰",business:"사업자번호",none:"발행 안 함"};
const fmtD=iso=>{if(!iso)return"";const p=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(iso));const g=k=>p.find(x=>x.type===k).value;return g("year")+"."+g("month")+"."+g("day")};
const fmtDT=iso=>iso?new Date(iso).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
function deriveItems(x,P){const won=v=>{const n=parseInt(String(v||"").replace(/[^\d]/g,""),10);return isNaN(n)?0:n};const out=[];
 const f=(list,name)=>(list||[]).find(p=>p.ko===name);
 const s=f(P.snap,x.snapProduct);if(x.snapProduct)out.push({name:"본식 스냅 · "+x.snapProduct,price:s?won(s.price):0});
 const ad=(x.addons||[]).map(v=>{const m=/^(스냅|영상) · (.*)$/.exec(v);if(!m)return{g:"snap",name:v,label:v};return{g:m[1]==="스냅"?"snap":"dvd",name:m[2],label:m[1]+" 추가상품 · "+m[2]}});
 ad.filter(a=>a.g==="snap").forEach(a=>{const p=(P.addons||[]).find(q=>(q.group||"snap")==="snap"&&q.name===a.name);out.push({name:a.label,price:p?won(p.price):0})});
 const d=f(P.dvd,x.dvdProduct);if(x.dvdProduct)out.push({name:"본식 DVD · "+x.dvdProduct,price:d?won(d.price):0});
 ad.filter(a=>a.g==="dvd").forEach(a=>{const p=(P.addons||[]).find(q=>q.group==="dvd"&&q.name===a.name);out.push({name:a.label,price:p?won(p.price):0})});
 return out}
function fillPrice(x,P){if(x.imported)return x;if(!(x.priceItems||[]).length)x.priceItems=deriveItems(x,P);if(!x.priceTotal)x.priceTotal=x.priceItems.reduce((s,i)=>s+(+i.price||0),0);return x}
async function loadBookings(){try{const j=await api({action:"list"});const P=await loadContent().catch(()=>({}));bookings=j.items.map(b=>fillPrice(b,P||{}));STATUSES=j.statuses||STATUSES;
 renderBookings()}
 catch(x){$("#bkList").innerHTML=`<div class="empty">${esc(x.message)}</div>`}}
const fmtTime=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");if(!m)return t||"";let h=+m[1];const ap=h<12?"오전":"오후";h=h%12||12;return `${ap} ${h}시`+(m[2]!=="00"?` ${+m[2]}분`:"")};
const withAdd=(p,g,a)=>[p,...(a||[]).filter(x=>x.startsWith(g+" · ")).map(x=>x.slice(g.length+3))].filter(Boolean).join(" + ");
let page=1,openId=null;const PER=15;
const hl=(t,q)=>{t=esc(t||"");if(!q)return t;const e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(e,"gi"),m=>`<mark>${m}</mark>`)};
function detailHTML(b){const r=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:"";
 return `<article class="bk" data-id="${b.id}"><div class="info"><p class="bk-title">러브어바웃 예약글 작성 목록</p><dl>
  ${r("예약자 이름",b.name)}${r("예약자 연락처",b.phone)}${r("배우자 이름",b.spouseName)}${r("배우자 연락처",b.spousePhone)}${r("예식 날짜",b.weddingDate)}${r("예식 시작 시간",fmtTime(b.weddingTime))}${r("예식장",b.hall)}${r("본식 스냅",withAdd(b.snapProduct,"스냅",b.addons))}${r("본식 DVD",withAdd(b.dvdProduct,"영상",b.addons))}${r("짝꿍코드",b.partnerCode)}${r("현금영수증",b.receiptType&&b.receiptType!=="none"?rtypeLabel[b.receiptType]+" "+b.receiptNumber:"발행 안 함")}${r("요청사항",b.message)}</dl>
  <p class="pwrow">예약자 비밀번호${b.password?`<code>${esc(b.password)}</code>`:` · 이 글은 이전 방식으로 저장돼서 확인할 수 없어요`}</p><p class="wrote">작성일 ${fmtDT(b.createdAt)}</p></div>
  <div class="side"><div class="tg"><button type="button" class="tPaid" aria-pressed="${!!b.paid}">${b.paid?"✓ ":""}입금확인</button><button type="button" class="tConf" aria-pressed="${!!b.confirmed}">${b.confirmed?"✓ ":""}예약확정</button></div>
  <div class="pbox"><p class="pbox-h">결제 금액</p>${(b.priceItems||[]).length?`<ul class="pitems">${b.priceItems.map(i=>`<li><span>${esc(i.name)}</span><span>${money(i.price)||"0"}원</span></li>`).join("")}</ul>`:""}
   <label>총 상품 금액<input class="pTot" inputmode="numeric" value="${money(b.priceTotal||0)}"></label>
   <label>할인 금액<input class="pDis" inputmode="numeric" value="${money(b.discount||0)}"></label>
   <label>${b.snapProduct&&b.dvdProduct?"스냅+DVD 예약금":b.dvdProduct?"DVD 예약금":"스냅 예약금"}<input class="pDep" inputmode="numeric" value="${money((b.imported?(b.deposit||0):(b.deposit||200000*((b.snapProduct?1:0)+(b.dvdProduct?1:0)))))}"></label>
   <p class="pbal">남은 잔금 <b>${money(Math.max(0,(b.priceTotal||0)-(b.discount||0)-((b.imported?(b.deposit||0):(b.deposit||200000*((b.snapProduct?1:0)+(b.dvdProduct?1:0)))))))||"0"}원</b></p></div>
  <label>관리자 메모<textarea class="sMemo" rows="3">${esc(b.adminMemo||"")}</textarea></label>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm fill sSave" type="button">저장</button><button class="btn sm danger sDel" type="button">삭제</button></div><p class="msg sMsg" role="status"></p></div></article>`}
function bindDetail(el){const id=+el.dataset.id,m=el.querySelector(".sMsg");
  const tog=(sel,key)=>{const btn=el.querySelector(sel);btn.onclick=async()=>{const b=bookings.find(x=>x.id===id),v=!b[key];btn.disabled=true;const fields={[key]:v};if(key==="paid"&&v&&!b.deposit){const dep=200000*((b.snapProduct?1:0)+(b.dvdProduct?1:0));if(dep)fields.deposit=dep}try{await api({action:"update",id,fields});Object.assign(b,fields);renderBookings()}catch(x){btn.disabled=false;m.className="msg sMsg err";m.textContent=x.message}}};
  tog(".tPaid","paid");tog(".tConf","confirmed");
  const upd=()=>{const num=c=>Number(String(el.querySelector(c).value).replace(/[^\d]/g,""))||0;el.querySelector(".pbal b").textContent=(money(Math.max(0,num(".pTot")-num(".pDis")-num(".pDep")))||"0")+"원"};
  el.querySelectorAll(".pTot,.pDis,.pDep").forEach(i=>i.oninput=()=>{const p=i.selectionStart,l=i.value.length;i.value=money(i.value);upd()});
  el.querySelector(".sSave").onclick=async()=>{m.className="msg sMsg";m.textContent="저장하는 중…";const num=c=>Number(String(el.querySelector(c).value).replace(/[^\d]/g,""))||0;const F={adminMemo:el.querySelector(".sMemo").value,priceTotal:num(".pTot"),discount:num(".pDis"),deposit:num(".pDep")};try{await api({action:"update",id,fields:F});const b=bookings.find(x=>x.id===id);Object.assign(b,F);renderBookings();const m2=document.querySelector(`.bk[data-id="${id}"] .sMsg`);if(m2){m2.className="msg sMsg ok";m2.textContent="저장했어요."}}catch(x){m.className="msg sMsg err";m.textContent=x.message}};
  el.querySelector(".sDel").onclick=()=>{m.className="msg sMsg";m.innerHTML=`<span class="confirm">이 예약을 삭제할까요? 되돌릴 수 없어요. <button class="btn sm danger yes" type="button">삭제</button><button class="btn sm no" type="button">취소</button></span>`;
   m.querySelector(".no").onclick=()=>m.textContent="";m.querySelector(".yes").onclick=async()=>{try{await api({action:"delete",id});bookings=bookings.filter(x=>x.id!==id);openId=null;renderBookings()}catch(x){m.className="msg sMsg err";m.textContent=x.message}}}}
function renderBookings(){const q=$("#q").value.trim(),f=$("#fStatus").value,ql=q.toLowerCase();
 const list=bookings.filter(b=>(!f||(f==="confirmed"?b.confirmed:!b.confirmed))&&(!q||String(b.name||"").toLowerCase().includes(ql)));
 $("#counts").innerHTML=`<button type="button" class="chip cnt pend${$("#fStatus").value==="pending"?" on":""}" data-f="pending">접수 <b>${bookings.filter(b=>!b.confirmed).length}</b></button><button type="button" class="chip cnt conf${$("#fStatus").value==="confirmed"?" on":""}" data-f="confirmed">예약확정 <b>${bookings.filter(b=>b.confirmed).length}</b></button>`;
 $$("#counts .cnt").forEach(c=>c.onclick=()=>{const fs=$("#fStatus");fs.value=fs.value===c.dataset.f?"":c.dataset.f;page=1;openId=null;renderBookings()});
 $("#qInfo").textContent=q||f?`검색 결과 ${list.length}건`+(q?` · "${q}"`:"")+(f?` · ${$("#fStatus").selectedOptions[0].text}`:""):"";
 const pages=Math.max(1,Math.ceil(list.length/PER));if(page>pages)page=pages;const slice=list.slice((page-1)*PER,page*PER);
 $("#bkList").innerHTML=slice.length?slice.map((b,i)=>{const no=list.length-((page-1)*PER+i);const prod=[withAdd(b.snapProduct,"스냅",b.addons),withAdd(b.dvdProduct,"영상",b.addons)].filter(Boolean).join(" / ");
  return `<tr class="row${openId===b.id?" open":""}" data-id="${b.id}" tabindex="0" aria-expanded="${openId===b.id}"><td class="c-no">${no}</td><td class="name">${hl(b.name,q)} 본식 예약 <span class="lk">🔒</span></td><td class="c-who">${hl(b.name,q)}</td><td class="c-date">${fmtD(b.createdAt)}</td><td class="c-st"><div class="flags">${b.paid?'<span class="st paid">입금확인</span>':""}${b.confirmed?'<span class="st conf">예약확정</span>':""}${!b.paid&&!b.confirmed?'<span class="none">—</span>':""}</div></td></tr>`+(openId===b.id?`<tr class="detail"><td colspan="5">${detailHTML(b)}</td></tr>`:"")}).join("")
  :`<tr><td colspan="5" class="empty">${bookings.length?"검색 결과가 없어요.":"아직 접수된 예약이 없어요."}</td></tr>`;
 $("#pager").innerHTML=pages>1?Array.from({length:pages},(_,k)=>`<button type="button" data-p="${k+1}"${k+1===page?' aria-current="page"':""}>${k+1}</button>`).join(""):"";
 $$("#pager button").forEach(x=>x.onclick=()=>{page=+x.dataset.p;openId=null;renderBookings()});
 $$("#bkList tr.row").forEach(tr=>{const t=()=>{const id=+tr.dataset.id;openId=openId===id?null:id;renderBookings()};tr.onclick=t;tr.onkeydown=e=>{if(e.key==="Enter")t()}});
 $$("#bkList .bk").forEach(bindDetail)}
$("#qForm").onsubmit=e=>{e.preventDefault();page=1;openId=null;renderBookings()};
$("#q").oninput=()=>{page=1;renderBookings()};$("#fStatus").onchange=()=>{page=1;renderBookings()};$("#reload").onclick=loadBookings;

/* 상품·약관 */
async function loadContent(){if(content)return content;let c=null;try{c=(await (await fetch("/api/content",{cache:"no-store"})).json()).content}catch(e){}
 if(!c){try{c=await (await fetch("/content-default.json",{cache:"no-store"})).json()}catch(e){c={}}}
 content={snap:c.snap||[],dvd:c.dvd||[],addons:c.addons||[],terms:c.terms||{notice:"",privacy:""}};return content}
function prodRow(k,p,i){if(k==="addons")return `<div class="prow add" data-k="${k}" data-i="${i}"><label>구분<select class="pg"><option value="snap"${(p.group||"snap")==="snap"?" selected":""}>스냅</option><option value="dvd"${p.group==="dvd"?" selected":""}>영상</option></select></label><label>추가 상품명<input class="pn" value="${esc(p.name)}"></label><label>가격 (원)<input class="pp" inputmode="numeric" value="${esc(p.price)}"></label><label>설명<input class="pd" value="${esc(p.desc||"")}"></label><button class="btn sm danger pdel" type="button" aria-label="삭제">삭제</button></div>`;
 return `<div class="prow" data-k="${k}" data-i="${i}"><label>상품명<input class="pn" value="${esc(p.ko)}"></label><label>영문 표기<input class="pe" value="${esc(p.en||"")}"></label><label>가격 (원)<input class="pp" inputmode="numeric" value="${esc(p.price)}"></label><label>구성 (한 줄에 하나)<textarea class="pi" rows="4">${esc((p.items||[]).join("\n"))}</textarea></label><button class="btn sm danger pdel" type="button">삭제</button></div>`}
function renderProducts(){[["snap","#pSnap"],["dvd","#pDvd"],["addons","#pAdd"]].forEach(([k,el])=>{$(el).innerHTML=content[k].length?content[k].map((p,i)=>prodRow(k,p,i)).join(""):`<p class="soft">아직 없어요.</p>`});
 $$(".pdel").forEach(b=>b.onclick=()=>{collect();const r=b.closest(".prow");content[r.dataset.k].splice(+r.dataset.i,1);renderProducts()})}
$$("[data-add]").forEach(b=>b.onclick=()=>{collect();const k=b.dataset.add;content[k].push(k==="addons"?{group:"snap",name:"",price:"",desc:""}:{ko:"",en:"",price:"",items:[]});renderProducts()});
const money=v=>{const d=String(v).replace(/[^\d]/g,"");return d?Number(d).toLocaleString("ko-KR"):""};
function collect(){$$(".prow").forEach(r=>{const k=r.dataset.k,i=+r.dataset.i,p=content[k][i];if(!p)return;
 if(k==="addons"){p.group=r.querySelector(".pg").value;p.name=r.querySelector(".pn").value.trim();p.price=money(r.querySelector(".pp").value);p.desc=r.querySelector(".pd").value.trim()}
 else{p.ko=r.querySelector(".pn").value.trim();p.en=r.querySelector(".pe").value.trim();p.price=money(r.querySelector(".pp").value);p.items=r.querySelector(".pi").value.split("\n").map(s=>s.trim()).filter(Boolean)}})}
async function save(msgEl){msgEl.className="msg";msgEl.textContent="저장하는 중…";try{await api({action:"saveContent",content});msgEl.className="msg ok";msgEl.textContent="저장했어요. 홈페이지를 새로고침하면 반영돼요."}catch(x){msgEl.className="msg err";msgEl.textContent=x.message}}
$("#saveProducts").onclick=()=>{collect();const bad=["snap","dvd"].some(k=>content[k].some(p=>!p.ko||!p.price))||content.addons.some(p=>!p.name);
 if(bad){$("#pMsg").className="msg err";$("#pMsg").textContent="상품명과 가격을 모두 적어주세요.";return}save($("#pMsg"))};
$("#saveTerms").onclick=()=>{content.terms={notice:$("#tNotice").value,privacy:$("#tPrivacy").value};save($("#tMsg"))};
$("#pwForm").onsubmit=async e=>{e.preventDefault();const m=$("#aMsg");if($("#npw").value!==$("#npw2").value){m.className="msg err";m.textContent="비밀번호 확인이 일치하지 않아요.";return}
 try{await api({action:"changePassword",newPassword:$("#npw").value});m.className="msg ok";m.textContent="비밀번호를 바꿨어요.";$("#npw").value=$("#npw2").value=""}catch(x){m.className="msg err";m.textContent=x.message}};
boot();
</script>
